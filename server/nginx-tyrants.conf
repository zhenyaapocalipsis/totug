# Раздача обновлений игры (автообновление клиента): только папка /opt/tyrants/www.
# Ставится deploy.sh в /etc/nginx/sites-available/tyrants.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Короткая ссылка для новых игроков: сама папка сразу отдаёт архив игры.
    location = /tyrants { return 302 /tyrants/TyrantsOfTheUnderdark.zip; }
    location = /tyrants/ { return 302 /tyrants/TyrantsOfTheUnderdark.zip; }

    location /tyrants/ {
        alias /opt/tyrants/www/;
        autoindex off;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }
}
