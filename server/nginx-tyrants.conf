# Раздача обновлений игры (автообновление клиента): только папка /opt/tyrants/www.
# Ставится deploy.sh в /etc/nginx/sites-available/tyrants.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /tyrants/ {
        alias /opt/tyrants/www/;
        autoindex off;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }
}
